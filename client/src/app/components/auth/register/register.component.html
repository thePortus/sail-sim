<div class="page-container">
  <div class="auth-card" *ngIf="!user?.loggedIn">
    <h1>Bay of Pirates Simulator</h1>
    <p class="subtitle">Create a new account</p>

    <form #myform="ngForm" (ngSubmit)="onSubmit(myform)" class="auth-form">
      <div class="field-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" placeholder="Choose a username" ngModel autocomplete="username">
      </div>
      <div class="field-group">
        <label for="callsign">Pirate Name</label>
        <input id="callsign" type="text" name="callsign" placeholder="Choose a pirate name" ngModel autocomplete="pirate-name">
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Create a password" ngModel autocomplete="new-password">
      </div>
      <div class="field-group">
        <label for="password2">Confirm Password</label>
        <input id="password2" type="password" name="password2" placeholder="Repeat password" ngModel autocomplete="new-password">
      </div>

      <div class="error-box" *ngIf="showErrorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Creating account…' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-switch">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>

    <app-download-client></app-download-client>
  </div>

  <div class="auth-card" *ngIf="user?.loggedIn">
    <h1>Bay of Pirates</h1>
    <p class="subtitle">You are signed in as <strong>{{ user?.username }}</strong></p>
    <a routerLink="/" class="btn-primary" style="text-align:center;">Go to Home</a>
    <button class="btn-secondary" (click)="logout()">Sign Out</button>
  </div>
</div>
