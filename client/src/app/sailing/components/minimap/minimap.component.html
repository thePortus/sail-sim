<div class="minimap-wrapper"
     [class.minimap-wrapper--expanded]="expanded()"
     (click)="onMapClick()">

  <canvas #canvas
          [width]="expanded() ? 600 : 200"
          [height]="expanded() ? 600 : 200"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onPointerMove($event)"
          (mouseleave)="onPointerLeave()"
    class="minimap-canvas">
  </canvas>

  <!-- Expand/collapse hint -->
  <div class="minimap-hint">
    {{ expanded() ? '✕ M to close · scroll zoom · drag pan' : 'M or click to expand' }}
  </div>

  <!-- Island name label (expanded only) -->
  @if (expanded()) {
    <div class="minimap-title">Bay of Pirates</div>
  }
</div>
