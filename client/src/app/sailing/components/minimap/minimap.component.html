<div class="minimap-wrapper"
     [class.minimap-wrapper--expanded]="expanded()"
     (click)="onMapClick()">

  <canvas #canvas
          [width]="expanded() ? 600 : 200"
          [height]="expanded() ? 600 : 200"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onPointerMove($event)"
          (mouseleave)="onPointerLeave()"
          (contextmenu)="onContextMenu($event)"
    class="minimap-canvas">
  </canvas>

  <!-- Admin-only right-click teleport menu (positioned at the clicked point within the wrapper) -->
  @if (teleportMenu(); as tm) {
    <button class="minimap-teleport-btn"
            [style.left.px]="tm.px"
            [style.top.px]="tm.py"
            (click)="$event.stopPropagation(); confirmTeleport()">
      ⚓ Teleport here
      <span class="minimap-teleport-coords">{{ tm.x | number:'1.0-0' }}, {{ tm.z | number:'1.0-0' }}</span>
    </button>
  }

  <!-- Expand/collapse hint -->
  <div class="minimap-hint">
    {{ expanded() ? '✕ M to close · scroll zoom · drag pan' : 'M or click to expand' }}
  </div>

  <!-- Island name label (expanded only) -->
  @if (expanded()) {
    <div class="minimap-title">Bay of Pirates</div>
  }
</div>
