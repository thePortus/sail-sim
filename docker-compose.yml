services:
  mysqldb:
    image: docker.io/mysql:5.7
    container_name: sail-sim-mysqldb
    restart: unless-stopped
    platform: linux/x86_64
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=sail-sim
    ports:
      - 4307:3306
    volumes:
      - db:/var/lib/mysql
    networks:
      - server-network

  nodejs:
    container_name: sail-sim-nodejs
    depends_on:
      - mysqldb
    build: server/
    restart: unless-stopped
    ports:
      - 9080:8080
    volumes:
      # Persist the generated assets across `docker compose down`/rebuilds. server/assets holds BOTH committed
      # files (geometry/, music/, maps/) AND the expensive gitignored generated ones (terrain tiles, biome KTX2,
      # baked navgrids, sky textures, *-src/) that the runtime pipeline (`docker exec … npm run terrain` etc.)
      # writes. Without this they live only in the container's writable layer and are lost on every teardown,
      # forcing a full re-bake. Bind-mounting the host repo dir makes it the single source of truth: the
      # container sees whatever is already generated on the host, and new bakes persist back to the host.
      # (Safe to overlay — the Dockerfile builds NO assets at image-build time; they're all runtime-generated.)
      - ./server/assets:/server/assets
    environment:
      - DB_HOST=mysqldb
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=sail-sim
      - DB_LOCAL_PORT=4307
      - DB_PORT=3306
      - WEB_PORT=8080
      - JWT_SECRET=secret
      - OWNER_USERNAME=admin
      - OWNER_PASSWORD=123456
      - OWNER_CALLSIGN=Teach
      # OpenTopography API key for the terrain source-fetch tooling (Copernicus GLO-30 DEM).
      # Set OPENTOPO_API_KEY in a repo-root ".env" file (copy from .env.example); blank if unset.
      - OPENTOPO_API_KEY=${OPENTOPO_API_KEY:-}
    stdin_open: true
    tty: true
    networks:
      - server-network

  angular:
    container_name: sail-sim-angular
    build:
      context: client/
      args:
        - BUILD_CONFIG=production
        - BASE_HREF=/
    restart: unless-stopped
    ports:
      - 9082:80
    networks:
      - server-network

volumes:
  db:

networks:
  server-network:
    driver: bridge
