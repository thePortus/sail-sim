services:
  mysqldb:
    image: docker.io/mysql:5.7
    container_name: sail-sim-mysqldb
    restart: unless-stopped
    platform: linux/x86_64
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=sail-sim
    ports:
      - 4307:3306
    volumes:
      - db:/var/lib/mysql
    networks:
      - server-network

  nodejs:
    container_name: sail-sim-nodejs
    depends_on:
      - mysqldb
    build: server/
    restart: unless-stopped
    ports:
      - 9080:8080
    environment:
      - DB_HOST=mysqldb
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=sail-sim
      - DB_LOCAL_PORT=4307
      - DB_PORT=3306
      - WEB_PORT=8080
      - JWT_SECRET=secret
      - OWNER_USERNAME=admin
      - OWNER_PASSWORD=123456
      - OWNER_EMAIL=admin@sail-sim.local
    stdin_open: true
    tty: true
    networks:
      - server-network

  angular:
    container_name: sail-sim-angular
    build:
      context: client/
      args:
        - BUILD_CONFIG=production
        - BASE_HREF=/
    restart: unless-stopped
    ports:
      - 9082:80
    networks:
      - server-network

volumes:
  db:

networks:
  server-network:
    driver: bridge
